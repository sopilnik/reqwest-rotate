[package]
name = "reqwest-rotate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alexandr Sopilnik"]
license = "MIT OR Apache-2.0"
description = "A boring reqwest client wrapper: proxy rotation, per-host rate limiting, and retry-with-backoff."
repository = "https://github.com/KsandrKj/reqwest-rotate"
readme = "README.md"
keywords = ["reqwest", "proxy", "rate-limit", "retry", "scraping"]
categories = ["web-programming::http-client"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rustls-tls"]
# TLS via `rustls`, on by default. Turn off with `default-features = false`
# and enable `native-tls` instead to use your platform's own TLS.
rustls-tls = ["reqwest/rustls-tls"]
# TLS via your platform's native library (OpenSSL, Secure Transport,
# SChannel) instead of `rustls`.
native-tls = ["reqwest/native-tls"]
# Enables `socks4://`, `socks4a://`, `socks5://` and `socks5h://` proxies.
socks = ["reqwest/socks"]
# Enables `RequestBuilder::json`.
json = ["reqwest/json"]
# Enables `RequestBuilder::multipart`.
multipart = ["reqwest/multipart"]
# Debug-level `tracing` events for retries and proxy rotation.
tracing = ["dep:tracing"]

[dependencies]
h2 = "0.4"
http = "1"
httpdate = "1"
hyper = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["http2", "charset"] }
serde = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wiremock = "0.6"
