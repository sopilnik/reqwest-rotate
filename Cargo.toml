[package]
name = "reqwest-rotate"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alexandr Sopilnik"]
license = "MIT OR Apache-2.0"
description = "reqwest client wrapper with proxy rotation, per-host rate limiting and retry-with-backoff"
repository = "https://github.com/sopilnik/reqwest-rotate"
readme = "README.md"
keywords = ["reqwest", "proxy", "rate-limit", "retry", "scraping"]
categories = ["web-programming::http-client", "network-programming"]
exclude = [".github/", ".gitignore", "deny.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls"]
# TLS via `rustls`, on by default. reqwest builds this on `aws-lc-rs` and
# verifies certificates against the operating system's own trust store.
# Turn off with `default-features = false` and enable `native-tls` instead
# to use your platform's own TLS.
rustls = ["reqwest/rustls"]
# The old name for `rustls`, kept so a feature list written against 0.1
# keeps working.
rustls-tls = ["rustls"]
# TLS via your platform's native library (OpenSSL, Secure Transport,
# SChannel) instead of `rustls`.
native-tls = ["reqwest/native-tls"]
# Enables `socks4://`, `socks4a://`, `socks5://` and `socks5h://` proxies.
socks = ["reqwest/socks"]
# Enables `RequestBuilder::query`.
query = ["reqwest/query", "dep:serde"]
# Enables `RequestBuilder::form`.
form = ["reqwest/form", "dep:serde"]
# Enables `RequestBuilder::json`.
json = ["reqwest/json", "dep:serde"]
# Enables `RequestBuilder::multipart`.
multipart = ["reqwest/multipart"]
# Debug-level `tracing` events for retries and proxy rotation.
tracing = ["dep:tracing"]

[dependencies]
h2 = "0.4.2"
http = "1.1"
httpdate = "1"
hyper = { version = "1.6.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["http2", "charset"] }
serde = { version = "1.0.220", optional = true }
thiserror = "2.0.3"
tokio = { version = "1.28.1", default-features = false, features = ["time"] }
tracing = { version = "0.1.35", optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wiremock = "0.6"
