name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories, yanked crates and new stable clippy lints show up without
  # any push, so run this on a schedule too.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # One OS failing should not hide what the other two would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to a commit, this action needs the toolchain named below.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # fmt, clippy, the alias check, doc and publish do not depend on
      # the OS; running them three times over would only burn runner
      # minutes.
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy (default features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: clippy (all features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: clippy (native-tls)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --no-default-features --features native-tls --locked -- -D warnings
      - name: test (default features)
        run: cargo test --locked
      - name: test (all features)
        run: cargo test --all-features --locked
      - name: test (native-tls)
        run: cargo test --no-default-features --features native-tls --locked
      - name: check (rustls-tls alias)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --no-default-features --features rustls-tls --locked
      - name: doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: publish dry run
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check on MSRV (1.85)
        # Library only: dev-dependencies (wiremock) need a newer compiler.
        run: cargo check --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
