name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories, yanked crates and new stable clippy lints show up without
  # any push, so run this on a schedule too.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # One OS failing should not hide what the other two would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to a commit, this action needs the toolchain named below.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # fmt, clippy, the alias check, doc and publish do not depend on
      # the OS; running them three times over would only burn runner
      # minutes.
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy (default features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: clippy (all features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: clippy (native-tls)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --no-default-features --features native-tls --locked -- -D warnings
      - name: test (default features)
        run: cargo test --locked
      - name: test (all features)
        run: cargo test --all-features --locked
      - name: test (native-tls)
        run: cargo test --no-default-features --features native-tls --locked
      - name: check (rustls-tls alias)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --no-default-features --features rustls-tls --locked
      - name: doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: publish dry run
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check on MSRV (1.85)
        # Library only: dev-dependencies (wiremock) need a newer compiler.
        run: cargo check --all-features --locked

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-hack
      - name: feature powerset
        # Depth 2 keeps this to pairs - nine features would be 512
        # combinations otherwise. rustls and native-tls together are
        # pointless; rustls-tls is only the old name for rustls.
        # Dev-dependencies stay in: --no-dev-deps prunes their entries from
        # Cargo.lock and --locked forbids that, and with resolver 3 their
        # features do not reach the library build anyway.
        run: cargo hack check --feature-powerset --depth 2 --group-features rustls,rustls-tls --mutually-exclusive-features rustls,native-tls --locked

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The resolver flag this needs is nightly-only.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-hack,cargo-minimal-versions
      - name: minimal versions
        # Direct dependencies at the lowest version each requirement
        # allows; transitive ones stay current, since other crates' floors
        # are not this crate's to fix.
        run: cargo minimal-versions check --direct --all-features

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The baseline is the latest release on crates.io; a breaking change
      # is only allowed together with the version bump that says so.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: default-features
          # The toolchain above is pinned, so the action must not
          # install its own.
          rust-toolchain: manual

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources
      # A new advisory in a dependency is not a reason to block an
      # unrelated pull request; it shows up on the next push or the
      # weekly run instead.
      - name: advisories
        if: github.event_name != 'pull_request'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  docsrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: doc (docs.rs flags)
        # The same flags docs.rs uses, so a broken feature badge fails
        # here first.
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
