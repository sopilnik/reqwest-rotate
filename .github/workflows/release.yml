name: Release

# Runs only when a version tag is pushed. The tag must equal the version in
# Cargo.toml and point at a commit that is on main. Publishing uses crates.io
# trusted publishing: the job's OIDC token is exchanged for a short-lived
# crates.io token, so no long-lived registry token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    # A pipeline fails when any command in it fails, not only the last one.
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_PREBUILT_NASM: 1
  # One exact compiler for every job: the job that publishes can run long
  # after the one that packaged, and a newer cargo can write a different
  # normalised manifest into the .crate. Rust 1.99.1, released 2026-10-16.
  RUST_VERSION: "1.99.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tag check below needs main's history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: tag matches Cargo.toml and main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "reqwest-rotate") | .version')
          if [ -z "$version" ]; then
            echo "::error::could not read the crate version from Cargo.toml"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo package --locked
          mkdir dist
          cp "target/package/reqwest-rotate-${VERSION}.crate" dist/
      # Pinned to an exact version and built from its lock file.
      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version '=0.5.9' --locked
      - name: software bill of materials
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all --override-filename reqwest-rotate-sbom
          mv reqwest-rotate-sbom.json "dist/reqwest-rotate-${VERSION}.cdx.json"
      - name: checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      # Checked here, before anything is uploaded to crates.io: a tag
      # without a changelog section must not publish.
      - name: release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir notes
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The trusted publisher on crates.io names this environment; its
    # required reviewer is the last gate before anything is uploaded.
    environment: release
    permissions:
      contents: read
      # Exchanged for the crates.io publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creates the release and uploads its files.
      contents: write
      # Signs the attestation with a short-lived certificate.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      # What crates.io now serves must be the file that is attested and
      # attached, byte for byte.
      - name: published crate equals the built one
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 \
            --output "published.crate" \
            "https://static.crates.io/crates/reqwest-rotate/reqwest-rotate-${VERSION}.crate"
          cmp published.crate "dist/reqwest-rotate-${VERSION}.crate"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.cdx.json
      # Releases are immutable: assets go on a draft, which is published
      # only once they are all there.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TAG" --notes-file notes/notes.md \
            "dist/reqwest-rotate-${VERSION}.crate" \
            "dist/reqwest-rotate-${VERSION}.cdx.json" \
            dist/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
