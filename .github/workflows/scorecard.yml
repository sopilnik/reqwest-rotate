name: Scorecard

on:
  push:
    # Scorecard only supports the default branch.
    branches: [main]
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF file to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image scorecard-action v2.5.0 runs, pinned by digest because its
      # tag can be moved. Dependabot does not update it; see
      # docs/decisions/0006-scorecard-image-pinned-by-digest.md.
      - uses: docker://ghcr.io/ossf/scorecard-action@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627 # v2.5.0
        # A docker:// step skips the action's input defaults, so the inputs
        # this run reads are passed here, and internal_default_token as
        # action.yaml would: the image reads it only when repo_token is
        # empty or results are published, and neither holds on this run.
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ github.token }}
          internal_default_token: ${{ github.token }}
          # Publishing feeds the badge and the public Scorecard API, not code
          # scanning, and would need id-token: write.
          publish_results: false
          file_mode: archive
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
