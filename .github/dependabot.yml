version: 2
updates:
  # Pinned SHAs go stale on their own; this keeps them moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Cargo.lock only: the floors in Cargo.toml are set on purpose and
  # checked by the minimal-versions job, so they are not moved here.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      cargo:
        patterns: ["*"]
